<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Memo — 생각을 정리하다</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Memo 홈"><span class="brand-mark">M</span><span>MEMO</span></a>
    <span class="local-indicator"><span class="status-dot"></span> 이 기기에 저장 중</span>
  </header>

  <main class="layout">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">YOUR PERSONAL SPACE</p>
      <h1 id="page-title">생각을 정리하다<span class="accent">.</span></h1>
      <p class="subtitle">떠오르는 생각을 기록하고, 중요한 일에 집중하세요.</p>
    </section>

    <section class="workspace" aria-label="메모 관리">
      <div class="compose-panel">
        <div class="panel-heading">
          <div><span class="step">01</span><h2 id="form-heading">새 메모</h2></div>
          <span class="required-note">모든 항목은 선택 사항입니다</span>
        </div>
        <form id="memo-form">
          <input type="hidden" id="memo-id">
          <label class="field-label" for="memo-title">제목</label>
          <input id="memo-title" name="title" type="text" maxlength="120" placeholder="메모 제목을 입력하세요" autocomplete="off">
          <label class="field-label body-label" for="memo-content">내용</label>
          <textarea id="memo-content" name="content" rows="5" maxlength="10000" placeholder="지금 떠오르는 생각을 적어보세요..."></textarea>
          <div class="form-footer">
            <span id="form-hint" class="form-hint" aria-live="polite">메모는 이 브라우저에 안전하게 저장됩니다.</span>
            <div class="form-actions">
              <button id="cancel-edit" class="button button-quiet hidden" type="button">취소</button>
              <button id="save-button" class="button button-primary" type="submit"><span class="plus">+</span> 메모 저장</button>
            </div>
          </div>
        </form>
      </div>

      <section class="notes-section" aria-labelledby="notes-heading">
        <div class="notes-toolbar">
          <div class="notes-title-group"><span class="step">02</span><h2 id="notes-heading">내 메모</h2><span id="memo-count" class="count">0</span></div>
          <label class="search-box" for="search-input"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.7"></circle><path d="m13 13 4 4"></path></svg><input id="search-input" type="search" placeholder="메모 검색" autocomplete="off"><kbd>/</kbd></label>
        </div>
        <div id="memo-list" class="memo-list" aria-live="polite"></div>
      </section>
    </section>
    <footer class="page-footer"><span>MEMO</span><span>작은 기록이 큰 생각을 만듭니다.</span></footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-title">
    <form method="dialog"><p class="eyebrow">DELETE NOTE</p><h2 id="delete-title">이 메모를 삭제할까요?</h2><p class="dialog-copy">삭제한 메모는 복구할 수 없습니다.</p><div class="dialog-actions"><button class="button button-quiet" value="cancel">취소</button><button id="confirm-delete" class="button button-danger" value="confirm">삭제하기</button></div></form>
  </dialog>
</body>
</html>
